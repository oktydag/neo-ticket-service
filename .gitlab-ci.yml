stages:
  - build
  - unit-test
  - integration-test
  - deploy

variables:
  MAVEN_IMAGE: maven:3.9.9-eclipse-temurin-25
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B --no-transfer-progress"
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

default:
  cache:
    key:
      files:
        - pom.xml
    paths:
      - .m2/repository

build:
  stage: build
  image: $MAVEN_IMAGE
  script:
    - mvn $MAVEN_CLI_OPTS compile

build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  needs: ["build"]
  script:
    - docker build -t "$IMAGE" .
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker push "$IMAGE"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi

unit-test:
  stage: unit-test
  image: $MAVEN_IMAGE
  needs: ["build"]
  script:
    - mvn $MAVEN_CLI_OPTS test -DexcludedGroups=integration
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/

integration-test:
  stage: integration-test
  image: $MAVEN_IMAGE
  needs: ["build"]
  script:
    - mvn $MAVEN_CLI_OPTS test -Dgroups=integration
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/

.deploy:
  image: alpine/k8s:1.30.2
  script:
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_CONTENT" | base64 -d > ~/.kube/config
    - cd .deploy/overlays/$ENVIRONMENT_NAME
    - kustomize edit set image registry.example.com/neo-ticket-service="$IMAGE"
    - kubectl apply -k .
    - kubectl rollout status deployment/neo-ticket-service -n neo-ticket-$ENVIRONMENT_NAME --timeout=180s

deploy-stage:
  extends: .deploy
  stage: deploy
  variables:
    ENVIRONMENT_NAME: stage
    KUBECONFIG_CONTENT: $KUBE_CONFIG_STAGE
  environment:
    name: stage
    url: https://stage.neo-ticket.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-production:
  extends: .deploy
  stage: deploy
  variables:
    ENVIRONMENT_NAME: production
    KUBECONFIG_CONTENT: $KUBE_CONFIG_PRODUCTION
  environment:
    name: production
    url: https://neo-ticket.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
