spring:
  datasource:
    url: jdbc:h2:mem:neoticket-test-${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=20000
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

neo:
  security:
    bcrypt-strength: 4
    jwt:
      secret: test-only-secret-that-is-long-enough-for-hmac-sha256
      issuer: https://neo.example/ticket-test
      access-token-ttl: PT15M
      refresh-token-ttl: PT2H

  rate-limit:
    enabled: false
    authentication:
      capacity: 10
      refill-period: PT1M
    general:
      capacity: 120
      refill-period: PT1M

  idempotency:
    ttl: PT24H

  seed:
    enabled: false
    password: unused-in-tests

logging:
  level:
    com.neo.ticket: INFO
    org.hibernate.SQL: WARN
