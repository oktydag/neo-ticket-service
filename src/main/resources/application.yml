spring:
  application:
    name: neo-ticket-service

  profiles:
    default: dev

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:mem:neoticket;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: neo-ticket-pool
      maximum-pool-size: 20

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates the mapping against it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

neo:
  security:
    jwt:
      secret: ${NEO_JWT_SECRET:dev-only-neo-ticket-secret-change-me-before-deploying}
      issuer: https://neo.example/ticket
      access-token-ttl: PT15M
      refresh-token-ttl: P7D

  client-address:

    trust-forwarded-headers: false

  rate-limit:
    enabled: true
    authentication:
      capacity: 10
      refill-period: PT1M
    general:
      capacity: 120
      refill-period: PT1M

  idempotency:
    ttl: PT24H

  seed:
    enabled: false
    password: change-me-in-development

logging:
  level:
    com.neo.ticket: INFO

---
spring:
  config:
    activate:
      on-profile: dev

neo:
  seed:
    enabled: true
    password: neo-dev-password

logging:
  level:
    com.neo.ticket: DEBUG

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${NEO_DB_URL:jdbc:postgresql://localhost:5432/neoticket}
    username: ${NEO_DB_USER:neoticket}
    password: ${NEO_DB_PASSWORD:neoticket}
    driver-class-name: org.postgresql.Driver
